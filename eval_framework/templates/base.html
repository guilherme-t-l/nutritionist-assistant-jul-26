<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Eval Framework{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --canvas: #ebe6de;
      --canvas-deep: #e2dcd2;
      --surface: #faf8f4;
      --surface-raised: #fffcf7;
      --ink: #1c1b19;
      --ink-soft: #3a3834;
      --muted: #6e6a62;
      --accent: #3a4a38;
      --accent-hover: #2f3d2e;
      --sage: #7d917c;
      --sage-soft: #e6ebe4;
      --line: rgba(28, 27, 25, 0.08);
      --line-strong: rgba(28, 27, 25, 0.14);
      --danger: #8f3a32;
      --danger-soft: #f3e4e2;
      --ok: #3a4a38;
      --ok-soft: #e4e8e1;
      --warn: #8a6a2f;
      --warn-soft: #f5efdf;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Figtree", system-ui, sans-serif;
      --radius-md: 8px;
      --radius-lg: 16px;
      --shadow: 0 1px 0 rgba(28, 27, 25, 0.04), 0 12px 40px rgba(28, 27, 25, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      font-size: 1rem;
      color: var(--ink);
      background: linear-gradient(180deg, var(--canvas) 0%, var(--canvas-deep) 100%);
      background-attachment: fixed;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3 {
      font-family: var(--font-display);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0;
    }
    .shell {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
    }
    .brand {
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: var(--ink);
    }
    .brand span { color: var(--muted); font-size: 0.95rem; margin-left: 0.4rem; }
    .nav { display: flex; gap: 1rem; align-items: center; font-weight: 500; }
    .nav a { color: var(--ink-soft); }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 1.25rem 1.35rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 40px;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-md);
      font-family: var(--font-body);
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 0.15s ease, transform 0.08s ease;
    }
    .btn:active:not(:disabled) { transform: translateY(1px); }
    .btn:disabled { opacity: 0.55; cursor: wait; }
    .btn-primary { background: var(--accent); color: var(--surface); }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border-color: var(--sage);
    }
    .btn-pass { background: var(--ok); color: var(--surface); min-width: 8rem; }
    .btn-fail { background: var(--danger); color: #fff; min-width: 8rem; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--line-strong);
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .badge-generating { background: var(--warn-soft); color: var(--warn); }
    .badge-ready { background: var(--ok-soft); color: var(--ok); }
    .badge-error { background: var(--danger-soft); color: var(--danger); }
    .muted { color: var(--muted); }
    .kbd {
      display: inline-block;
      min-width: 1.4rem;
      padding: 0.05rem 0.35rem;
      border: 1px solid var(--line-strong);
      border-radius: 4px;
      font-size: 0.75rem;
      font-family: ui-monospace, monospace;
      background: var(--surface-raised);
    }
    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">Eval Framework <span>local tool</span></div>
      <nav class="nav">
        <a href="/">Batches</a>
        <a href="/dashboard">Dashboard</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
